# Risk & eksekusi (docs/05-risk-and-execution.md).
# mode global "paper" mengalahkan profile "live". Ganti ke live HANYA dengan persetujuan eksplisit.
mode: paper

bankroll:
  reference_sol: 2.0
  min_sol_reserve: 0.15

limits:
  max_open_positions: 12          # dinaikkan untuk profile eksplorasi (paper)
  max_open_per_profile: 4
  max_position_sol: 0.25
  max_exposure_sol: 1.5
  max_trades_per_day: 200
  reentry_cooldown_min: 30
  no_averaging_down: true

daily:
  max_loss_sol: 0.3
  profit_lock_sol: 0.6
  profit_lock_action: halve_size

trading_hours_utc:
  enabled: false
  allow: ["00:00-04:00", "12:00-18:00"]

circuit_breakers:
  consecutive_losses: { n: 5, pause_min: 30 }
  drawdown_from_peak_pct: { value: 25, action: pause_profile }
  data_stale_sec: 10
  provider_error_rate: { window_min: 5, max_pct: 30 }
  rpc_latency_ms_p95: 1500
  exec_fail_rate: { window: 10, max_pct: 40 }
  slippage_anomaly: { window: 10, avg_extra_bps: 300 }

execution:
  default_route: jupiter_v2_order
  fallback_route: pump_direct
  slippage_bps_entry: 800
  # biaya murah sesuai preferensi user: priority fee total (lamports, bukan micro-lamport/CU)
  priority_fee_lamports: { entry: 10000, exit: 50000, panic_max: 500000 }
  tip_lamports: { entry: 10000, exit: 100000 }   # 0.00001 SOL entry, 0.0001 SOL exit (Sender swqos min 0.000005)
  max_fee_pct_of_trade: 2.0
  sender:
    url: "http://sg-sender.helius-rpc.com/fast"
    swqos_only: true
    mev_protect: true
    fallback_region: tokyo
  close_ata_after_exit: true
  confirm_timeout_ms: 20000

paper:
  latency_ms: 900
  p_fail_entry: 0.08
  p_fail_exit: 0.05

kill_switch:
  file_flag: /run/memebot/KILL
  telegram_admin_chat_ids: []
