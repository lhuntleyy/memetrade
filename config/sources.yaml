# Collector (docs/02-research.md §1). Fase 1.
pumpportal:
  enabled: true
  ws_url: "wss://pumpportal.fun/api/data"   # WAJIB 1 koneksi saja
  new_token: true
  migration: true
  token_trades: false        # metered 0.01 SOL / 10k event, butuh API key + wallet

dexscreener:
  enabled: true
  base_url: "https://api.dexscreener.com"
  poll_sec: { profiles: 30, boosts_latest: 30, boosts_top: 120 }   # dilonggarkan setelah kena 429 (2026-10-17)
  rpm: { profiles: 60, pairs: 300 }
  # proxy (env DEXSCREENER_PROXY_URL): fallback = langsung dulu, lewat proxy hanya saat IP VPS kena 429.
  # always ≈ 1.9 GB/hari trafik proxy (residential dibayar per GB) — hati-hati biaya.
  proxy_mode: fallback

gmgn:
  enabled: false             # butuh GMGN_API_KEY + whitelist IP VPS
  poll_sec: 20
  feeds: [trending, trenches, hot]

# Wallet tracker: tiap token yang dievaluasi pipeline → ambil top holder (GMGN) → catat
#  - top_n holder terbesar (tanpa akun pool/exchange)
#  - wallet dengan total beli ≥ $500 / ≥ $1000 (tier)
wallet_tracker:
  enabled: true
  top_n: 10
  big_buyer_usd: [500, 1000]
  fetch_limit: 50
  min_interval_sec: 6        # holders berbobot 5 = satu bucket penuh GMGN free
  rescan_after_min: 360
  delay_sec: 120
  # Skor wallet (0–100): win share token, token pump ≥+50%, bebas rug, total profit, tag GMGN.
  # Wallet dengan skor ≥ min_score (dan sampel ≥ min_tokens token) otomatis masuk watchlist (maks auto_watch_top).
  scoring:
    lookback_days: 7
    min_tokens: 3
    min_score: 60
    auto_watch_top: 50
    refresh_min: 15
  # Konfluensi → trigger "wallet.smart_confluence" untuk profile smart_money
  confluence:
    enabled: true
    min_wallets: 2           # minimal 2 wallet bagus beli token yang sama
    window_min: 30           # dalam 30 menit terakhir
    rescan_after_min: 5      # token dengan 1 wallet bagus di-scan ulang tiap 5 menit
    rescan_max: 3
    activity_poll:           # pantau pembelian terbaru wallet watchlist (GMGN wallet_activity bobot 3)
      enabled: true
      polls_per_min: 6
      max_wallets: 30

meteora:
  enabled: false
  poll_sec: 30

tracker:
  track_minutes: 90
  max_concurrent_tokens: 300
  tick_flush_ms: 1000
